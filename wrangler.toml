name = "wuu-dict"
main = "worker/index.js"
compatibility_date = "2025-10-01"

routes = [
  { pattern = "wuu.baiyangsz.top", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "wuu-dict-users"
database_id = "c7ce945d-0f36-48f7-b0a6-abfcba2eec98"
migrations_dir = "migrations"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"

[observability]
enabled = false
